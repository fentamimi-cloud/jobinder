version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: jobinder-postgres
    environment:
      POSTGRES_DB: jobinder_dev
      POSTGRES_USER: jobinder
      POSTGRES_PASSWORD: password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/shared/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./backend/shared/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobinder -d jobinder_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jobinder-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: jobinder-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass "redispassword"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - jobinder-network

  # Elasticsearch for Search
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.8.0
    container_name: jobinder-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - jobinder-network

  # Firebase Emulator Suite
  firebase-emulator:
    image: andreysenov/firebase-tools:latest
    container_name: jobinder-firebase
    command: firebase emulators:start --only firestore,auth,storage --project demo-project --host 0.0.0.0
    ports:
      - "9099:9099"   # Auth emulator
      - "8080:8080"   # Firestore emulator
      - "9199:9199"   # Storage emulator
      - "4000:4000"   # Emulator UI
    volumes:
      - ./firebase.json:/home/node/firebase.json:ro
      - ./firestore.rules:/home/node/firestore.rules:ro
      - ./firestore.indexes.json:/home/node/firestore.indexes.json:ro
      - firebase_data:/home/node/.cache
    environment:
      - FIREBASE_TOKEN=${FIREBASE_TOKEN:-}
    networks:
      - jobinder-network

  # LocalStack for AWS services simulation
  localstack:
    image: localstack/localstack:latest
    container_name: jobinder-localstack
    environment:
      - SERVICES=s3,sqs,sns
      - DEFAULT_REGION=us-east-1
      - DATA_DIR=/tmp/localstack/data
      - DOCKER_HOST=unix:///var/run/docker.sock
    ports:
      - "4566:4566"
      - "4571:4571"
    volumes:
      - localstack_data:/tmp/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - jobinder-network

  # Mailhog for email testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: jobinder-mailhog
    ports:
      - "1025:1025"   # SMTP server
      - "8025:8025"   # Web UI
    networks:
      - jobinder-network

  # MinIO for S3-compatible object storage
  minio:
    image: minio/minio:latest
    container_name: jobinder-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - jobinder-network

  # Adminer for database management
  adminer:
    image: adminer:latest
    container_name: jobinder-adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - jobinder-network
    depends_on:
      postgres:
        condition: service_healthy

networks:
  jobinder-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  elasticsearch_data:
    driver: local
  firebase_data:
    driver: local
  localstack_data:
    driver: local
  minio_data:
    driver: local
